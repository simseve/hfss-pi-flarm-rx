# Alpium OGN station: keys only. The Alpium server's key is installed for
# hfss restricted to tailnet sources; an installer may add their own key
# before running install.sh (or keep passwords with --keep-ssh-passwords).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
